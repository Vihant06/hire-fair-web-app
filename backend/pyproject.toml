[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hirefair-backend"
version = "1.0.0"
description = "HireFair Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "python-multipart==0.0.9",
    "PyMuPDF==1.23.26",
    "scikit-learn==1.5.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "sqlalchemy==2.0.30",
    "pytest==8.2.2",
    "pytest-asyncio==0.23.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]